[project]
name = "acoustic-beacon-backend"
version = "0.1.0"
requires-python = ">=3.12"
description = "Acoustic Beacon campaign resolution API — Phase 1"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2", "pydantic-settings>=2.6,<3", "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
