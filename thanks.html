<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>You're on the List | Acoustic Beacon</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;

      font-family: Arial, Helvetica, sans-serif;
      color: #fff;

      background:
        linear-gradient(
          rgba(4, 3, 15, 0.50),
          rgba(4, 3, 15, 0.72)
        ),
        url("assets/hero-desktop.webp") center center / cover no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .thank-you {
      width: 100%;
      max-width: 680px;

      text-align: center;

      padding: 48px 36px;

      background: rgba(8, 6, 25, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 22px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .icon {
      width: 62px;
      height: 62px;

      margin: 0 auto 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;

      font-size: 30px;
      font-weight: 700;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: -0.04em;

      margin-bottom: 18px;
    }

    p {
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.6;

      color: rgba(255, 255, 255, 0.82);

      margin-bottom: 32px;
    }

    a {
      display: inline-block;

      padding: 14px 26px;

      color: #fff;
      text-decoration: none;
      font-weight: 700;

      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.08);

      transition: 0.2s ease;
    }

    a:hover {
      background: #fff;
      color: #111;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;

        background:
          linear-gradient(
            rgba(4, 3, 15, 0.48),
            rgba(4, 3, 15, 0.72)
          ),
          url("assets/hero-mobile.webp") center center / cover no-repeat;
      }

      .thank-you {
        padding: 38px 22px;
        border-radius: 18px;
      }

      .icon {
        width: 54px;
        height: 54px;
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="thank-you">

    <div class="icon">✓</div>

    <h1>You're on the list.</h1>

    <p>
      We'll let you know when Acoustic Beacon is ready.
    </p>

    <a href="/">← Back to Acoustic Beacon</a>

  </main>

</body>
</html>
