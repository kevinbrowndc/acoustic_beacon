# Review Render's displayed charges before applying. No resources exist yet.
services:
  - type: web
    name: acoustic-beacon-api
    runtime: python
    plan: 0.5c-512mb
    region: ohio
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements-lock.txt
    preDeployCommand: python -m app.deploy
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log --no-proxy-headers
    healthCheckPath: /health/ready
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AB_ENVIRONMENT
        value: production
      - key: AB_DATABASE_URL
        fromDatabase:
          name: acoustic-beacon-db
          property: connectionString
      - key: AB_CORS_ORIGINS
        value: '[]'
      - key: AB_PROVISION_TEST_BEACON
        value: 'true'
databases:
  - name: acoustic-beacon-db
    plan: 0.1c-256mb
    region: ohio
    postgresMajorVersion: '17'
    databaseName: acoustic_beacon
    user: acoustic_beacon
    diskSizeGB: 1
    ipAllowList: []
